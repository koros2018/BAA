# Alembic config (T-C1 unified data layer)
# DB URL is NOT hardcoded here: env.py resolves it via resolve_database_url()
# (BAA_DATABASE_URL env var wins, falls back to SQLite data/baa.db).
# Temp override: alembic -x db_url=postgresql+psycopg://... upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
