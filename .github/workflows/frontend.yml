name: Frontend Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: "JS Syntax & HTML Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JSHint
        run: npm install -g jshint

      - name: JSHint — src/frontend/*.js
        run: |
          # 只阻断 E 级错误；W 级警告不阻断（bundle 为生成的现代 JS，W119 等为噪声）
          jshint src/frontend/*.js --config .jshintrc 2>&1 | tee /tmp/jshint.log || true
          if grep -qE "\(E[0-9]{3}\)" /tmp/jshint.log; then
            echo "JSHint 发现 E 级错误:"
            cat /tmp/jshint.log
            exit 1
          fi
          echo "JSHint passed (no E-level errors)"

      - name: 检查 alert() 残留
        run: |
          if grep -rn "window\.alert\|[^a-zA-Z]alert(" src/frontend/*.js | grep -v "showToast\|alert(" | grep -v "/*"; then
            echo "发现未迁移的 alert() 调用"
            exit 1
          fi
          echo "No raw alert() calls found"

      - name: 检查前端 HTML 基本结构
        run: |
          python3 -c "
          from html.parser import HTMLParser
          class TagChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  void = {'br','hr','img','input','meta','link','source','area','base','col','embed','track','wbr'}
                  if tag not in void:
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  void = {'br','hr','img','input','meta','link','source','area','base','col','embed','track','wbr'}
                  if tag in void:
                      return  # void 元素无闭合标签，HTMLParser 容错会报 endtag，跳过
                  if self.stack and self.stack[-1] == tag:
                      self.stack.pop()
                  else:
                      self.errors.append(f'unmatched </{tag}>')
          c = TagChecker()
          with open('src/frontend/index.html') as f:
              c.feed(f.read())
          if c.errors:
              print('HTML errors:', c.errors)
              raise SystemExit(1)
          if c.stack:
              print('Unclosed tags:', c.stack)
              raise SystemExit(1)
          print('HTML structure OK')
          "

      - name: 前端 JS 语法检查（node --check）
        run: |
          for f in src/frontend/*.js; do
            node --check "$f"
          done
          echo "All JS files pass node --check syntax check"
