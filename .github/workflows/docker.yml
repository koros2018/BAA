name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: baa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose_smoke:
    name: "Compose Smoke (T-C5: docker compose up -d 生产就绪验收)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for API healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ${i}0s"; exit 0; fi
            sleep 10
          done
          echo "== baa logs =="; docker compose logs --tail=80 baa
          echo "== postgres logs =="; docker compose logs --tail=40 postgres
          exit 1

      - name: Verify endpoints (health + metrics + auth gate)
        run: |
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/metrics | grep -q baa_http_requests_total
          # T-C4 安全基线：匿名默认关闭 —— 无密钥访问受保护接口应 401/403
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/v1/functions)
          [ "$code" = "401" ] || [ "$code" = "403" ] || { echo "anonymous not blocked: $code"; exit 1; }
          # 合法密钥可用
          curl -sf -H "Authorization: Bearer baa_dev_2026" http://127.0.0.1:8000/api/v1/functions > /dev/null

      - name: Verify DB schema migrated
        run: |
          docker compose exec -T postgres psql -U baa -d baa -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" \
            | grep -q "1[3-9]\|2[0-9]"

      - name: Teardown
        if: always()
        run: docker compose down -v

  push_ghcr:
    name: "Push GHCR (tags only)"
    runs-on: ubuntu-latest
    needs: compose_smoke
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
