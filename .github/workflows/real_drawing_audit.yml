name: Real Drawing Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一早 8:00 UTC = 北京时间下午 16:00
    - cron: '0 8 * * 1'
  workflow_dispatch:  # 手动触发

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ezdxf
          
      - name: Run real drawing audit
        run: python3 scripts/real_drawing_audit.py
        
      - name: Check audit report
        run: |
          python3 -c "
import json
with open('data/real_drawing_audit_report.json') as f:
    report = json.load(f)
# 检查解析失败
parse_fails = [r['file'] for r in report if not r.get('success')]
if parse_fails:
    print(f'❌ 解析失败: {parse_fails}')
    exit(1)
# 检查黄金标准回归
# 审计脚本已输出黄金标准对比结果，exit code 0 表示无回归
print(f'✅ Audit passed: {len(report)} 张图纸, {sum(1 for r in report if r.get(\"success\"))} 张成功')
"