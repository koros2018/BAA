name: Real Drawing Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # 每周一 08:00 UTC 自动运行，检测基线漂移
  schedule:
    - cron: "0 0 * * 1"

jobs:
  audit:
    name: "Real Drawing Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run real drawing audit
        run: |
          python scripts/real_drawing_audit.py