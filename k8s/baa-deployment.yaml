---
apiVersion: v1
kind: Namespace
metadata:
  name: baa
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: baa-config
  namespace: baa
data:
  BAA_PORT: "8000"
  BAA_WORKERS: "4"
  BAA_DATA_DIR: "/app/data"
  BAA_RATE_LIMIT_ENABLED: "1"
  # 任务队列/密钥/限流的命名空间（生产固定 default）
  BAA_QUEUE_NAMESPACE: "default"
  PYTHONUNBUFFERED: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: baa-secret
  namespace: baa
type: Opaque
data:
  # 使用 base64 编码，生产环境建议用 External Secrets Operator 管理
  # 默认值: echo -n "baa_prod_2026" | base64
  BAA_API_KEY: YmFhX3Byb2RfMjAyNg==
  # T-C2 无状态化：多副本共享 PostgreSQL（限流计数/密钥/任务队列）
  BAA_DATABASE_URL: cG9zdGdyZXNxbCtwc3ljb3BnOi8vYmFhOmJhYV9wZ18yMDI2QGJhYS1wb3N0Z3Jlczo1NDMyL2JhYQ==
  POSTGRES_PASSWORD: YmFhX3BnXzIwMjY=
  POSTGRES_USER: YmFh
  POSTGRES_DB: YmFh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baa
  namespace: baa
  labels:
    app: baa
spec:
  replicas: 3
  selector:
    matchLabels:
      app: baa
  template:
    metadata:
      labels:
        app: baa
    spec:
      # 共享对象存储: 将 /app/data 挂载为 PVC（或改用 S3 minio 侧车）
      # 本示例使用 PVC；生产环境建议替换为 CSI driver (e.g. Ceph RBD / EBS)
      volumes:
        - name: baa-data
          persistentVolumeClaim:
            claimName: baa-data-pvc
      containers:
        - name: baa
          image: baa:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: baa-config
            - secretRef:
                name: baa-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: baa-data
              mountPath: /app/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baa-data-pvc
  namespace: baa
spec:
  # T-C2：多副本必须共享同一 /app/data（上传图纸跨副本可读），
  # ReadWriteMany 需集群具备 RWX 存储类（NFS / CephFS / EFS 等）。
  # 若只有块存储（EBS/RBD），请改用对象存储（S3/MinIO）承载图纸目录，
  # 此时可删掉本 PVC 与 Deployment 中的 volumeMounts。
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: baa-postgres
  namespace: baa
  labels:
    app: baa-postgres
spec:
  clusterIP: None
  selector:
    app: baa-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: baa-postgres
  namespace: baa
  labels:
    app: baa-postgres
spec:
  serviceName: baa-postgres
  replicas: 1
  selector:
    matchLabels:
      app: baa-postgres
  template:
    metadata:
      labels:
        app: baa-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: baa-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baa-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: baa-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "baa", "-d", "baa"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "baa", "-d", "baa"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: baa-pdb
  namespace: baa
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: baa
---
apiVersion: v1
kind: Service
metadata:
  name: baa-service
  namespace: baa
spec:
  type: ClusterIP
  selector:
    app: baa
  ports:
    - port: 80
      targetPort: 8000
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: baa-ingress
  namespace: baa
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # 启用 WebSocket/SSE 长连接支持（批量审查 SSE 推送）
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  rules:
  - host: baa.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: baa-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: baa-hpa
  namespace: baa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: baa
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
