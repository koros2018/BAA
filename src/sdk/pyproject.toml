[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baa-sdk"
version = "2.5.80"
description = "BAA (Blueprint AI Agent) Python SDK — 建筑图纸 AI 合规审查"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "BAA Team", email = "team@baa.ai"},
]
keywords = ["baa", "blueprint", "architecture", "compliance", "dxfs", "fire-safety"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# 零必需依赖：httpx 可选（缺失时自动回退 urllib）
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools]
packages = ["baa_sdk"]

[tool.setuptools.package-dir]
baa_sdk = "."

[tool.setuptools.package-data]
baa_sdk = ["openapi.json"]
